<html>

<head>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            margin: 0;
            padding: 20px;
            text-align: center;
            width: 250px;
        }

        h1 {
            font-size: 18px;
            color: #333;
            margin-bottom: 20px;
        }

        footer {
            margin-top: 20px;
            font-size: 12px;
            color: #666;
        }

        .hidden { display:none; }

        #loading {
            align-items: center;
            justify-content: center;
            margin-bottom: 0.5rem;
            height: 24px; /* para que no baile el layout si lo ocultas */
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0, 0, 0, 0.1);
            border-top-color: #4CAF50;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <h1>MangaPark Image Fix</h1>

    <div id="loading"><div class="spinner"></div></div>
    <p id="message" style="margin: 1rem 0; font-size: 12px">Fixing...</p>

    <footer>v1.2 by <a href="https://github.com/VictorPerezAsuaje" target="_blank" rel="noopener noreferrer">Victor Perez Asuaje</a></footer>
    <script src="index.js"></script>
</body>

</html>
